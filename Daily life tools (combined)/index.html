<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <div id="nav-holder"></div>
<div class="clock">
    <div class="numbers"></div>

    <div class="hand hour" id="hour"></div>
    <div class="hand min" id="min"></div>
    <div class="hand sec" id="sec"></div>

    <div class="center"></div>
</div>
<h3 id="time"></h3>
    <div class="bookmarkscontainer">
        <div id="bookmarks">
            <button class="addBookmark"><b>+</b></button>
            <dialog class="addBookmarkDialog">
                <h3 class="inputName">Name</h3>
                <input type="text" class="addName">
                <h3 class="inputName">URL</h3>
                <input type="text" class="addUrl"> 
                <br>
                <button class="dialogInput ok">Ok</button>
                <button class="dialogInput back">Back</button>
            </dialog>
        </div>

    </div>
    <script src="clock.js"></script>
    <script src="links.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
