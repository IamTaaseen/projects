<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <div id="nav-container">
        <div id="up-nav"><button id="nav-button"><i class="fa-solid fa-bars"></i></button></div>
        <div id="menu-menu">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="#">To Do</a></li>
                <li><a href="#">Notes</a></li>
                <li><a href="stopwatch.html">Stopwatch</a></li>
                <li><a href="timer.html">Timer</a></li>
            </ul>
        </div>
    </div>
<div class="clock">
    <div class="numbers"></div>

    <div class="hand hour" id="hour"></div>
    <div class="hand min" id="min"></div>
    <div class="hand sec" id="sec"></div>

    <div class="center"></div>
</div>
<h3 id="time"></h3>
    <div id="bookmarks">
        <button class="addBookmark"><b>+</b></button>
        <dialog class="addBookmarkDialog">
            <h3 class="inputName">Name</h3>
            <input type="text" class="addName">
            <h3 class="inputName">URL</h3>
            <input type="text" class="addUrl"> 
            <br>
            <button class="dialogInput ok">Ok</button>
            <button class="dialogInput back">Back</button>
        </dialog>
    </div>
    <script src="clock.js"></script>
    <script src="links.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
