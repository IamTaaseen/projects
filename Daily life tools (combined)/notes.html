<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
</head>
<body>
    <div id="nav-holder"></div>
    <button class="addNoteButton">Add a note</button>
    <div class="NoteTakerDialog">
        <input type="text" class="NoteTakerName" placeholder="Name Here...">
        <textarea class="NoteTakerInput" placeholder="Notes Here..."></textarea>
        <div class="buttons">
            <button class="NoteTakerbutton done">Done</button>
            <button class="NoteTakerbutton back">Back</button>
        </div>
    </div>
    <div class="NoteContainer"></div>
    <script src="notes.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
