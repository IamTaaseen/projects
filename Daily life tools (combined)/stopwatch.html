<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
</head>
<body>
    <div id="nav-holder"></div>

    <input id="display" type="text" readonly>
    <button id="play-button"><i id="play-button-icon" class="fa-solid fa-play"></i></button>
    <button id="reset-button"><i id="rotate-button" class="fa-solid fa-rotate-right"></i></button>
    <button id="split"><i class="fa-solid fa-stopwatch-20"></i></button>
    <div id="split-container"></div>
    <script src="stopwatch.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
