<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
</head>
<body>
    <div id="nav-container">
        <div id="up-nav"><button id="nav-button"><i class="fa-solid fa-bars"></i></button></div>
        <div id="menu-menu">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="#">To Do</a></li>
                <li><a href="#">Notes</a></li>
                <li><a href="stopwatch.html">Stopwatch</a></li>
                <li><a href="timer.html">Timer</a></li>
            </ul>
        </div>
    </div> 
    <input type="text" id="timer-display" readonly>
    <h3 id="err"></h3>
    <dialog id="display-input-time">
        <h3>Hours:</h3><input type="number" id="hour-input" min="0" step="1">
        <h3>Minutes:</h3><input type="number" id="min-input" min="0" step="1">
        <h3>Seconds:</h3><input type="number" id="sec-input" min="0" step="1">
        <button id="display-input-time-back">Back</button>
        <button id="display-input-time-ok">OK</button>
    </dialog>
    <div id="buttons-container">
        <div id="main-control-buttons">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
        <div id="time-set-buttons">    
            <button id="sec1">+1sec</button>
            <button id="sec2">+2sec</button>
            <button id="sec15">+15sec</button>
            <button id="sec30">+30sec</button>
            <button id="min1">+1min</button> 
            <button id="min2">+2min</button>
            <button id="min5">+5min</button>
            <button id="min10">+10min</button>
            <button id="min30">+30min</button>
            <button id="hour1">+1h</button>
            <button id="hour5">+5h</button>
        </div>
    </div>  
    
    <script src="navigation.js"></script>
    <script src="timer.js"></script>
</body>
</html>
